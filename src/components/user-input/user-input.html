<form (ngSubmit)="onSubmit()">
  <div class="input-group">
    <p>
      <label for="initial">
        Initial Investment
      </label>
      <input id="initial" name="initial-investmet" type="number" [(ngModel)]="enteredInitialInvestment">
    </p>
    <p>
      <label for="annual">
        Annual Investment
      </label>
      <input id="annual" name="annual-investment" type="number" [(ngModel)]="enteredAnnualInvestment">
    </p>
  </div>

  <div class="input-group">
    <p>
      <label for="expected">
        Expected Return
      </label>
      <input id="expected" name="expected-investment" type="number" [(ngModel)]="enteredExpectedReturn">
    </p>
    <p>
      <label for="duration">
        Duration
      </label>
      <input id="duration" name="duration" type="number" [(ngModel)]="enteredDuration">
    </p>
  </div>

  <p>
    <button>Calculate</button>
  </p>
</form>
